COM_DHARMASHOP_HELP_WELCOME_TITLE="Getting started"
COM_DHARMASHOP_HELP_WELCOME_DESC="Create categories and fields, then add products. For products with multiple variants, create a group and configure its variant fields first. Then enable the modules you need and place them on the relevant site pages. Save your changes and check the storefront."
COM_DHARMASHOP_HELP_CATALOG_TITLE="Catalog and variants"
COM_DHARMASHOP_HELP_CATALOG_DESC="A product is a separately sellable item with its own price and stock. A group brings these items together on one page and defines the fields customers use to switch variants. Categories, brands and badges organize the catalog and product cards."
COM_DHARMASHOP_HELP_FIELDS_TITLE="Product fields"
COM_DHARMASHOP_HELP_FIELDS_DESC="Create a field group, then define characteristics and fill in their values on product records. Variant fields are selected in a product group; other characteristics remain regular product data."
COM_DHARMASHOP_HELP_ORDERS_TITLE="Orders and fulfilment"
COM_DHARMASHOP_HELP_ORDERS_DESC="An order stores its items and prices as they were at checkout. Use statuses to process orders, shipping and payment methods to control customer choices, and warehouses to track stock. Carts and customers are available separately."
COM_DHARMASHOP_HELP_EXTENSIONS_TITLE="Modules and settings"
COM_DHARMASHOP_HELP_EXTENSIONS_DESC="Modules render shop blocks in template positions: choose a position, assign the pages and publish the module. Plugins add field types, shipping, payment, notifications and integrations. General shop options are in the component settings."
COM_DHARMASHOP_HELP_MODULES_LINK="Shop modules"
COM_DHARMASHOP_HELP_PLUGINS_LINK="Dharma Shop plugins"
COM_DHARMASHOP_HELP_SETUP_TITLE="If something is missing"
COM_DHARMASHOP_HELP_SETUP_DESC="Check that the product and category are published, the menu item is correct, the module is assigned to the page and template position, and the required plugin is enabled. Field hints appear next to the options. The full user and developer guides are maintained in the project documentation."
