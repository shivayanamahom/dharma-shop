COM_DHARMASHOP_STATUS_STOCK_EFFECT="Остатки"
COM_DHARMASHOP_STATUS_STOCK_EFFECT_DESC="Остатки списываются при оформлении заказа (для товаров с включённым учётом). Статус «Возвращает остатки» (например, «Отменён») возвращает списанное на склад; если заказ вернуть в обычный статус, остатки спишутся снова."
COM_DHARMASHOP_STATUS_STOCK_EFFECT_KEEP="Остатки списаны (обычный статус)"
COM_DHARMASHOP_STATUS_STOCK_EFFECT_RETURN="Возвращает остатки на склад (отмена)"
