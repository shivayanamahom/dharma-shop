COM_DHARMASHOP_UPLOAD_ERROR_PASTE_UNSUPPORTED="Браузер не позволяет читать буфер обмена кнопкой: щёлкните по области и нажмите Ctrl+V."
COM_DHARMASHOP_UPLOAD_ERROR_PASTE_EMPTY="В буфере обмена нет картинки."
COM_DHARMASHOP_UPLOAD_ERROR_PASTE_DENIED="Нет доступа к буферу обмена: разрешите его в браузере или щёлкните по области и нажмите Ctrl+V."
COM_DHARMASHOP_CONFIG_CATALOG_DESC="Как выводится каталог на сайте по умолчанию. Категория может задать своё."
COM_DHARMASHOP_CONFIG_LIST_LIMIT_DESC="Сколько товаров показывать на странице, если категория не задала своё число."
COM_DHARMASHOP_CONFIG_LIST_ORDERING="Сортировка по умолчанию"
COM_DHARMASHOP_CONFIG_LIST_ORDERING_DESC="Как сортировать товары, если категория не задала свою сортировку."
COM_DHARMASHOP_CONFIG_ORDER="Оформление заказа"
COM_DHARMASHOP_CONFIG_ORDER_DESC="Значения по умолчанию для всех товаров. Категория может задать своё, а товар — своё: они переопределяют эти настройки (наследование: товар → категория → родительские категории → эти настройки)."
COM_DHARMASHOP_ORDER_QTY_MIN="Минимальное количество"
COM_DHARMASHOP_ORDER_QTY_MIN_DESC="Меньше этого количества в заказ добавить нельзя."
COM_DHARMASHOP_ORDER_QTY_STEP="Шаг количества"
COM_DHARMASHOP_ORDER_QTY_STEP_DESC="Количество можно менять только кратно шагу (например, 0,5 для метров)."
COM_DHARMASHOP_ORDER_QTY_MAX="Максимальное количество (0 — без ограничения)"
COM_DHARMASHOP_ORDER_QTY_MAX_DESC="Больше этого количества в заказ добавить нельзя; 0 — без ограничения."
COM_DHARMASHOP_ORDER_UNIT="Единица измерения"
COM_DHARMASHOP_ORDER_UNIT_DESC="Например: шт, м, т, м³."
COM_DHARMASHOP_ORDER_STOCK_TRACKED="Учёт остатков"
COM_DHARMASHOP_ORDER_STOCK_TRACKED_DESC="Если включено, товар без остатка считается отсутствующим. Если выключено, товар всегда в наличии."
COM_DHARMASHOP_ORDER_BACKORDER="Продавать без остатка"
COM_DHARMASHOP_ORDER_BACKORDER_DESC="Разрешает заказ, когда остаток равен нулю (при включённом учёте остатков)."
COM_DHARMASHOP_TAB_ORDER="Оформление заказа"
COM_DHARMASHOP_ORDER_BLOCK_QTY="Количество в заказе"
COM_DHARMASHOP_ORDER_BLOCK_STOCK="Остатки"
COM_DHARMASHOP_ORDER_INHERIT="Наследовать"
COM_DHARMASHOP_ORDER_INHERIT_HINT="Наследуется: %s"
COM_DHARMASHOP_ORDER_INHERIT_DESC="Сейчас наследуется: %s (%s)."
COM_DHARMASHOP_ORDER_FROM_SETTINGS="из настроек магазина"
COM_DHARMASHOP_ORDER_FROM_CATEGORY="из категории «%s»"
COM_DHARMASHOP_ORDER_UNLIMITED="без ограничения"
COM_DHARMASHOP_ORDER_NO_UNIT="без единицы"
COM_DHARMASHOP_ORDER_RECALC_NEEDED="Настройки оформления заказа изменены, но товаров в этой ветке много: запустите «Команды → Пересчитать цену и наличие товаров», чтобы применить учёт остатков."
COM_DHARMASHOP_ORDER_RECALC_DONE="Учёт остатков пересчитан у товаров этой ветки: %d."

COM_DHARMASHOP_CONFIG_IMAGES="Изображения"
COM_DHARMASHOP_CONFIG_IMAGES_DESC="Правила для загружаемых изображений (категории, бренды, позже товары). Конвертация в WebP, обрезка и размеры появятся здесь же."
COM_DHARMASHOP_CONFIG_IMAGE_NAME_MODE="Имя загруженного файла"
COM_DHARMASHOP_CONFIG_IMAGE_NAME_MODE_DESC="Случайное имя исключает совпадения у разных записей. «Оригинальное + случайное» сохраняет читаемость для поиска. Если выбрано оригинальное имя и такой файл уже есть, добавляется номер."
COM_DHARMASHOP_CONFIG_IMAGE_NAME_RANDOM="Случайное (например, 3fa9c1d70b.png)"
COM_DHARMASHOP_CONFIG_IMAGE_NAME_ORIGINAL_RANDOM="Оригинальное + случайный хвост (kofe-3fa9c1d70b.png)"
COM_DHARMASHOP_CONFIG_IMAGE_NAME_ORIGINAL="Оригинальное (kofe.png)"
COM_DHARMASHOP_CONFIG_IMAGE_NAME_PREFIX="Префикс имени файла"
COM_DHARMASHOP_CONFIG_IMAGE_NAME_PREFIX_DESC="Добавляется в начало имени каждого загруженного файла: латиница, цифры, дефис и подчёркивание. Пусто — без префикса."
COM_DHARMASHOP_CONFIGURATION="Настройки магазина"
COM_DHARMASHOP_CONFIG_IMAGE_BASE_FOLDER="Папка для изображений"
COM_DHARMASHOP_CONFIG_IMAGE_BASE_FOLDER_DESC="Папка внутри images/, куда загружаются файлы магазина. Латиница, цифры, дефис, подчёркивание; вложенность через «/» (например, shop/catalog). Пусто — dharmashop. Уже загруженные файлы остаются на месте и продолжают работать; при удалении записи файлы из прежней папки dharmashop тоже убираются."
COM_DHARMASHOP_CONFIG_IMAGE_FOLDER_MODE="Структура папок"
COM_DHARMASHOP_CONFIG_IMAGE_FOLDER_MODE_DESC="Как раскладывать файлы внутри папки для изображений. «Тип» — categories, icons и т. д. (позже products)."
COM_DHARMASHOP_CONFIG_IMAGE_FOLDER_TYPE_YEAR="Тип / год (categories/2026)"
COM_DHARMASHOP_CONFIG_IMAGE_FOLDER_TYPE_YEAR_MONTH="Тип / год / месяц (categories/2026/10)"
COM_DHARMASHOP_CONFIG_IMAGE_FOLDER_TYPE="Только тип (categories)"
COM_DHARMASHOP_CONFIG_IMAGE_FOLDER_FLAT="Все файлы в одной папке"
COM_DHARMASHOP_TAB_SEO="SEO"
COM_DHARMASHOP_SEO_FROM_COMPONENT="Из компонента (%s)"
COM_DHARMASHOP_SEO_TITLE_LABEL="&lt;title&gt;"
COM_DHARMASHOP_SEO_TITLE_DESC="Заголовок страницы во вкладке браузера и в выдаче поисковика. Пусто — шаблон из настроек магазина (вкладка «SEO»)."
COM_DHARMASHOP_SEO_DESCRIPTION_LABEL="&lt;meta name=\"description\"&gt;"
COM_DHARMASHOP_SEO_DESCRIPTION_DESC="Краткое описание страницы для поисковиков (до 300 символов). Пусто — шаблон из настроек магазина."
COM_DHARMASHOP_SEO_IMAGE_LABEL="&lt;meta name=\"image\"&gt;"
COM_DHARMASHOP_SEO_IMAGE_DESC="Картинка для превью ссылки в соцсетях и мессенджерах. Пусто — изображение записи, затем изображение по умолчанию из настроек магазина."
COM_DHARMASHOP_SEO_ROBOTS_LABEL="&lt;meta name=\"robots\"&gt;"
COM_DHARMASHOP_SEO_ROBOTS_DEFAULT="Из настроек магазина"
COM_DHARMASHOP_SEO_ROBOTS_DESC="Разрешить ли поисковикам индексировать страницу и переходить по её ссылкам. Пусто — значение из настроек магазина (сейчас: %s)."
COM_DHARMASHOP_SEO_BREADCRUMB_LABEL="Хлебные крошки"
COM_DHARMASHOP_SEO_BREADCRUMB_DESC="Как называется страница в цепочке «хлебных крошек». Пусто — шаблон из настроек магазина."
COM_DHARMASHOP_SEO_H1_LABEL="&lt;h1&gt;"
COM_DHARMASHOP_SEO_H1_DESC="Заголовок на странице. Пусто — шаблон из настроек магазина."
COM_DHARMASHOP_CONFIG_SEO="SEO"
COM_DHARMASHOP_CONFIG_SEO_DESC="Шаблоны заголовков и описаний страниц магазина: пустое SEO-поле у категории, бренда, бейджа или товара берёт шаблон отсюда. Подстановки: {global.sitename} — название сайта; {category.title}, {category.parent} — категория и её родитель; {brand.title}; {badge.title}; {product.title}, {product.sku}, {product.category}, {product.brand}."
COM_DHARMASHOP_CONFIG_SEO_ROBOTS_DESC="Значение для всех страниц магазина, у которых оно не задано отдельно."
COM_DHARMASHOP_CONFIG_SEO_OPENGRAPH="Open Graph"
COM_DHARMASHOP_CONFIG_SEO_OPENGRAPH_DESC="Выводить теги og:title, og:description и og:image для красивых превью ссылок в соцсетях и мессенджерах."
COM_DHARMASHOP_CONFIG_SEO_DEFAULT_IMAGE="Изображение по умолчанию"
COM_DHARMASHOP_CONFIG_SEO_DEFAULT_IMAGE_DESC="Используется в превью ссылки, если у страницы нет своей картинки (например, логотип магазина)."
COM_DHARMASHOP_CONFIG_SEO_CATEGORY="Страницы категорий"
COM_DHARMASHOP_CONFIG_SEO_BRAND="Страницы брендов"
COM_DHARMASHOP_CONFIG_SEO_BADGE="Страницы бейджей"
COM_DHARMASHOP_CONFIG_SEO_PRODUCT="Страницы товаров"
