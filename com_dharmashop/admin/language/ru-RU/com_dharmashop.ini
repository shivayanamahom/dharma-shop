COM_DHARMASHOP_CONFIG_SEARCH_DESCRIPTION="Искать в описании товара"
COM_DHARMASHOP_CONFIG_SEARCH_DESCRIPTION_DESC="Краткое и полное описание. Находит больше, но добавляет случайные совпадения (например, чехол «для iPhone» при запросе «iphone»)."
COM_DHARMASHOP_CONFIG_SEARCH_FIELDS="Искать в значениях полей"
COM_DHARMASHOP_CONFIG_SEARCH_FIELDS_DESC="Текстовые и списочные дополнительные поля товара."
COM_DHARMASHOP_CONFIG_SEARCH_CATEGORIES="Искать по названиям категорий и бренда"
COM_DHARMASHOP_CONFIG_SEARCH_CATEGORIES_DESC="Запрос «смартфоны» найдёт все товары этой категории."
COM_DHARMASHOP_CONFIG_SEARCH_TRANSLIT="Раскладка и транслитерация"
COM_DHARMASHOP_CONFIG_SEARCH_TRANSLIT_DESC="Запрос «ыфьыгтп» или «самсунг» найдёт Samsung (и наоборот: «parma» найдёт «Парма»)."
COM_DHARMASHOP_CONFIG_SEARCH_FUZZY="Мягкий поиск при отсутствии результатов"
COM_DHARMASHOP_CONFIG_SEARCH_FUZZY_DESC="Если ничего не найдено, слова запроса ищутся без последних букв — так находятся слова с опечаткой в конце («самсун», «samsug»)."
COM_DHARMASHOP_CONFIG_SEARCH_SYNONYMS_LIST="Синонимы запроса"
COM_DHARMASHOP_CONFIG_SEARCH_SYNONYMS_LIST_DESC="По одному правилу в строке: «слово = вариант, вариант». Запрос с левым словом дополнительно ищет варианты справа (отдельные слова). Пример: «айфон = iphone»."

; Image maintenance commands
COM_DHARMASHOP_IMAGE_COMMAND_PREPARE="Подготовить изображения"
COM_DHARMASHOP_IMAGE_COMMAND_CLEAR="Очистить кеш изображений"
COM_DHARMASHOP_IMAGE_COMMAND_SELECT="Контекст"
COM_DHARMASHOP_IMAGE_COMMAND_SELECT_DESC="Все действующие контексты или один выбранный. Размеры, формат и качество берутся из настроек изображений."
COM_DHARMASHOP_IMAGE_COMMAND_ALL="Все действующие контексты"
COM_DHARMASHOP_IMAGE_COMMAND_START="Начать подготовку"
COM_DHARMASHOP_IMAGE_COMMAND_PREVIEW="Проверить кеш"
COM_DHARMASHOP_IMAGE_COMMAND_CONTINUE="Продолжить обработку"
COM_DHARMASHOP_IMAGE_COMMAND_CONFIRM="Подтвердить очистку"
COM_DHARMASHOP_IMAGE_COMMAND_RESET="Сбросить обработку"
COM_DHARMASHOP_IMAGE_COMMAND_PREPARE_DESC="Создаёт копии заранее через плагин размеров. За один запуск обрабатывается порция; продолжайте кнопкой до завершения. Совпадающие параметры используют общую копию. Счётчики отражают обращения, включая уже готовые копии и повторные ссылки. SVG, GIF, внешние, отсутствующие и не обработанные плагином файлы остаются оригиналами."
COM_DHARMASHOP_IMAGE_COMMAND_CLEAR_DESC="Сначала проверяются ссылки магазина и подсчитываются производные в текущей папке кеша. После проверки нажмите «Подтвердить очистку». Очистка общая для всех контекстов, включая старый кеш v1. Исходники, файлы, выбранные в магазине как исходники, неизвестные файлы и символические ссылки сохраняются. Новые копии после начала проверки и занятые файлы пропускаются. При следующем обращении копии создадутся заново. Файлы блокировок и папки остаются. Сброс останавливает продолжение, но не отменяет уже выполненную работу."
COM_DHARMASHOP_IMAGE_COMMAND_PHASE_PREPARE="Подготовка идёт порциями. Нажмите «Продолжить обработку»."
COM_DHARMASHOP_IMAGE_COMMAND_PHASE_PROTECT="Проверяются ссылки на изображения магазина. Продолжите обработку."
COM_DHARMASHOP_IMAGE_COMMAND_PHASE_PREVIEW="Подсчитываются файлы кеша. Продолжите обработку. Изображения ещё не удаляются."
COM_DHARMASHOP_IMAGE_COMMAND_PHASE_REVIEW="Проверка завершена. Проверьте количество и объём ниже, затем подтвердите очистку."
COM_DHARMASHOP_IMAGE_COMMAND_PHASE_PROTECT_CLEAR="Повторно проверяются ссылки магазина перед удалением. Продолжите обработку."
COM_DHARMASHOP_IMAGE_COMMAND_PHASE_CLEAR="Очистка идёт порциями. Нажмите «Продолжить обработку»."
COM_DHARMASHOP_IMAGE_COMMAND_PHASE_DONE="Обработка завершена."
