COM_DHARMASHOP_IMAGE_COMMAND_COUNT_PROTECTED="Файлы кеша, выбранные как исходники (защищены)"
COM_DHARMASHOP_IMAGE_COMMAND_PATH="Проверьте папку кеша в настройках изображений: допустима папка внутри images без символических ссылок."
COM_DHARMASHOP_IMAGE_COMMAND_BUCKET="В одной папке кеша слишком много файлов. Обработка остановлена; проверьте структуру папки кеша."
COM_DHARMASHOP_IMAGE_COMMAND_DISABLED="Для подготовки включите плагин размеров и обработку изображений, добавьте контексты с ненулевым размером. Также требуется GD."
COM_DHARMASHOP_IMAGE_COMMAND_CONTEXT="Выбранный контекст отсутствует в действующих настройках размеров."
COM_DHARMASHOP_IMAGE_COMMAND_RESTART="Настройки изменились или обработка уже запущена. Нажмите «Сбросить обработку» и начните заново."
COM_DHARMASHOP_IMAGE_COMMAND_REFERENCES="Слишком много файлов кеша выбрано как исходники. Очистка остановлена для сохранности изображений."
COM_DHARMASHOP_IMAGE_COMMAND_ERROR="Не удалось обработать порцию изображений. Подробности в журнале Joomla; можно повторить или сбросить обработку."
