COM_DHARMASHOP_CONFIG_CART_GUEST_DAYS_DESC="Сколько дней хранится корзина гостя после последнего изменения (и cookie корзины). По умолчанию 30."
COM_DHARMASHOP_CONFIG_CART_USER_DAYS="Срок корзины пользователя, дней"
COM_DHARMASHOP_CONFIG_CART_USER_DAYS_DESC="Сколько дней хранится корзина вошедшего пользователя после последнего изменения. 0 — без срока (товары лежат, пока пользователь их не уберёт). По умолчанию 365."
COM_DHARMASHOP_CONFIG_ORDERS_CLAIM="Привязывать гостевые заказы к аккаунту"
COM_DHARMASHOP_CONFIG_ORDERS_CLAIM_DESC="Заказы, оформленные гостем с тем же e-mail, появятся в «Моих заказах» после входа. «Только подтверждённая почта» работает, когда в настройках пользователей Joomla включена активация по ссылке из письма и пользователь её прошёл."
