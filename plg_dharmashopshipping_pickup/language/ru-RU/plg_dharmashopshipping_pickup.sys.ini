PLG_DHARMASHOPSHIPPING_PICKUP_DESC="Самовывоз: пункт выдачи (склад) с адресом, контактами, часами работы, дополнительной информацией и картой. Один способ — один пункт; для нескольких пунктов создайте несколько способов этого типа. Макет можно переопределить в шаблоне: html/plg_dharmashopshipping_pickup/default.php."
