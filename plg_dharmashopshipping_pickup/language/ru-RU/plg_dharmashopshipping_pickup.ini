PLG_DHARMASHOPSHIPPING_PICKUP_POINTS="Пункты выдачи (склады)"
PLG_DHARMASHOPSHIPPING_PICKUP_POINTS_DESC="Добавьте один или несколько пунктов выдачи (складов). Покупатель выберет пункт при оформлении; если пункт один, он выбирается автоматически. Карта общая для всех пунктов — настраивается ниже. Цена и ограничения по сумме — на вкладке «Цены»."
PLG_DHARMASHOPSHIPPING_PICKUP_POINT_NAME="Название пункта"
PLG_DHARMASHOPSHIPPING_PICKUP_POINT_NAME_DESC="Например: «Склад на Ленина»."
PLG_DHARMASHOPSHIPPING_PICKUP_POINT_TERM="Срок готовности пункта"
PLG_DHARMASHOPSHIPPING_PICKUP_POINT_TERM_DESC="Если срок для этого пункта особый, например: «Готов завтра после 12:00»."
PLG_DHARMASHOPSHIPPING_PICKUP_ERROR_POINTS="Добавьте хотя бы один пункт выдачи."
PLG_DHARMASHOPSHIPPING_PICKUP_ERROR_POINT="У пункта выдачи должны быть заполнены название и адрес."
PLG_DHARMASHOPSHIPPING_PICKUP_POINT_REQUIRED="Выберите пункт выдачи."
PLG_DHARMASHOPSHIPPING_PICKUP_ROW_POINT="Пункт выдачи"
PLG_DHARMASHOPSHIPPING_PICKUP_ROW_TERM="Срок готовности"
PLG_DHARMASHOPSHIPPING_PICKUP_COORDS="Координаты склада"
PLG_DHARMASHOPSHIPPING_PICKUP_COORDS_DESC="Нужны для общей карты: пункт отмечается на ней меткой. Скопируйте из Яндекс Карт (правая кнопка по точке → «Что здесь?») в том же виде: [55.753994, 37.622093] — сначала широта, затем долгота. Без координат пункт на карте не показывается."
PLG_DHARMASHOPSHIPPING_PICKUP_MAP_SETTINGS="Карта"
PLG_DHARMASHOPSHIPPING_PICKUP_ZOOM_DESC="0 — Яндекс Карты показывают сразу все пункты (при одном пункте масштаб 16), OpenStreetMap — масштаб 16. Другое значение 1–19 задаёт масштаб явно."
PLG_DHARMASHOPSHIPPING_PICKUP_ERROR_COORDS_NEEDED="Для карты укажите координаты хотя бы у одного пункта."
