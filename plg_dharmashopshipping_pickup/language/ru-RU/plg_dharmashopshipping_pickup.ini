PLG_DHARMASHOPSHIPPING_PICKUP_MARKER_LABEL="Метка с названием склада"
PLG_DHARMASHOPSHIPPING_PICKUP_MARKER_COLOR="Цвет меток"
PLG_DHARMASHOPSHIPPING_PICKUP_MARKER_SELECTED_COLOR="Цвет выбранной метки"
PLG_DHARMASHOPSHIPPING_PICKUP_MARKER_SELECTED_COLOR_DESC="Метка выбранного покупателем пункта."
PLG_DHARMASHOPSHIPPING_PICKUP_CENTER="Центр карты"
PLG_DHARMASHOPSHIPPING_PICKUP_CENTER_DESC="Необязательно, в том же формате, что координаты склада: [55.753994, 37.622093]. Пусто — карта покажет все пункты (при масштабе 0) или выбранный пункт."
PLG_DHARMASHOPSHIPPING_PICKUP_RATIO="Высота карты (пропорции)"
PLG_DHARMASHOPSHIPPING_PICKUP_RATIO_DESC="Форма блока карты: высота считается от ширины (классы Bootstrap), поэтому карта одинаково выглядит на телефоне и на компьютере."
PLG_DHARMASHOPSHIPPING_PICKUP_RATIO_21X9="Низкая широкая (21:9)"
PLG_DHARMASHOPSHIPPING_PICKUP_RATIO_16X9="Стандартная (16:9)"
