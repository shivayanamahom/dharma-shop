PLG_DHARMASHOPSHIPPING_PICKUP="Dharma Shop: доставка — самовывоз"
PLG_DHARMASHOPSHIPPING_PICKUP_DESC="Самовывоз: один или несколько пунктов выдачи (складов) с адресом, контактами, часами работы, дополнительной информацией и картой; покупатель выбирает пункт при оформлении. Макет можно переопределить в шаблоне: html/plg_dharmashopshipping_pickup/default.php."
PLG_DHARMASHOPSHIPPING_PICKUP_TYPE="Самовывоз"
PLG_DHARMASHOPSHIPPING_PICKUP_SETTINGS="Самовывоз: пункты выдачи"
PLG_DHARMASHOPSHIPPING_PICKUP_ADDRESS="Адрес пункта выдачи"
PLG_DHARMASHOPSHIPPING_PICKUP_ADDRESS_DESC="Адрес склада или магазина, откуда покупатель заберёт заказ."
PLG_DHARMASHOPSHIPPING_PICKUP_PHONE="Телефон"
PLG_DHARMASHOPSHIPPING_PICKUP_EMAIL="E-mail"
PLG_DHARMASHOPSHIPPING_PICKUP_HOURS="Часы работы"
PLG_DHARMASHOPSHIPPING_PICKUP_HOURS_DESC="Например: «Пн–Пт 10:00–20:00, Сб–Вс 11:00–18:00»."
PLG_DHARMASHOPSHIPPING_PICKUP_INFO="Дополнительная информация"
PLG_DHARMASHOPSHIPPING_PICKUP_INFO_DESC="Как пройти, где парковаться, что взять с собой."
PLG_DHARMASHOPSHIPPING_PICKUP_TERM="Срок готовности (общий)"
PLG_DHARMASHOPSHIPPING_PICKUP_TERM_DESC="Показывается рядом с названием способа, например: «Готов через 1 час». У пункта может быть свой срок."
PLG_DHARMASHOPSHIPPING_PICKUP_PRICE="Стоимость самовывоза"
PLG_DHARMASHOPSHIPPING_PICKUP_PRICE_DESC="Обычно 0 — самовывоз бесплатен."
PLG_DHARMASHOPSHIPPING_PICKUP_FREE_FROM="Бесплатно от суммы заказа"
PLG_DHARMASHOPSHIPPING_PICKUP_FREE_FROM_DESC="Если сумма заказа (после скидок, без доставки) не меньше этого значения, самовывоз бесплатен. 0 — не использовать."
PLG_DHARMASHOPSHIPPING_PICKUP_MIN_TOTAL="Минимальная сумма заказа"
PLG_DHARMASHOPSHIPPING_PICKUP_MIN_TOTAL_DESC="Если сумма заказа меньше, пункт не показывается. 0 — без ограничения."
PLG_DHARMASHOPSHIPPING_PICKUP_MAX_TOTAL="Максимальная сумма заказа"
PLG_DHARMASHOPSHIPPING_PICKUP_MAX_TOTAL_DESC="Если сумма заказа больше, пункт не показывается. 0 — без ограничения."
PLG_DHARMASHOPSHIPPING_PICKUP_MAP="Карта"
PLG_DHARMASHOPSHIPPING_PICKUP_MAP_DESC="Одна карта на способ: пункты с координатами отмечены на ней метками, при выборе пункта карта центрируется на нём. Яндекс Карты показывают все метки, OpenStreetMap — только выбранный пункт. Подключается виджет внешнего сервиса: при просмотре карты браузер покупателя обращается к нему."
PLG_DHARMASHOPSHIPPING_PICKUP_MAP_NONE="Не показывать"
PLG_DHARMASHOPSHIPPING_PICKUP_MAP_YANDEX="Яндекс Карты"
