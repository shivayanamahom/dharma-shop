PLG_DHARMASHOPSHIPPING_PICKUP_MARKER_ADDRESS_DESC="Показывать ли под названием склада его адрес (для типа метки «Метка с названием склада»). «У выбранной» — адрес только у метки выбранного покупателем склада, подписи не наплывают друг на друга."
