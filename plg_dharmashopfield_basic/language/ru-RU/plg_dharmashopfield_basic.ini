PLG_DHARMASHOPFIELD_BASIC_FILES_SETTINGS_INVALID="Проверьте настройки файлов: допустимые форматы, размер от 0,1 до 1024 МБ, количество от 1 до 100."
PLG_DHARMASHOPFIELD_BASIC_FILES_PATH_INVALID="Файл не найден либо путь недопустим. Выберите локальный файл из папки images."
