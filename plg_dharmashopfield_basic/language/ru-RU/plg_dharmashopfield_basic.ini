PLG_DHARMASHOPFIELD_BASIC_VIDEO_LIGHTBOX="Открывать видео в Fancybox"
PLG_DHARMASHOPFIELD_BASIC_VIDEO_LIGHTBOX_DESC="Сервисные ролики открываются в iframe, загруженные — в HTML5-плеере. Если Fancybox отключён, карточка ведёт к встроенному плееру на странице."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_CAPTION="Показывать подписи"
PLG_DHARMASHOPFIELD_BASIC_VIDEO_FETCH_COVER="Получать обложки сервисных видео автоматически"
PLG_DHARMASHOPFIELD_BASIC_VIDEO_FETCH_COVER_DESC="Сервер получает миниатюру сервиса и сохраняет её в общей папке изображений. Для YouTube без API-ключа загружается стандартная обложка; ключ позволяет получить название и доступный вариант высокого разрешения. Если сервис недоступен, ссылку можно сохранить без обложки."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_FOLDER="Подпапка роликов"
PLG_DHARMASHOPFIELD_BASIC_VIDEO_FOLDER_DESC="Разделяет ролики разных полей. Латинские буквы, цифры, дефис и подчёркивание."
