PLG_DHARMASHOPFIELD_BASIC_FILES_COLUMNS_DESC="От 2 до 6 колонок на широком экране. На среднем экране — до двух, на телефоне — одна."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_MAX_COUNT="Максимум изображений"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_MAX_COUNT_DESC="От 1 до 100. Ограничение действует на каждое значение этого поля."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT="Макет вывода"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT_DESC="Галерея показывает сетку, слайдер использует Swiper. Если плагин Dharma Shop Swiper выключен, выводится галерея. Оба макета переопределяются в шаблоне Joomla."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT_GRID="Галерея"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT_SLIDER="Слайдер (Swiper)"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT="Отображение фотографии"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_DESC="Заполнение даёт ровную сетку без пустых полос и обрезает края без искажения пропорций. Вписывание показывает фото целиком в одинаковых рамках. Оригинальные пропорции убирают фиксированную высоту и не увеличивают маленькие изображения. Действует в галерее и слайдере."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_COVER="Заполнить рамку — обрезать края"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_CONTAIN="Вписать целиком — оставить поля"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_ORIGINAL="Оригинальные пропорции — без увеличения"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_RATIO="Формат рамки"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_RATIO_DESC="Одинаковое соотношение сторон для всех фотографий: квадрат 1:1, стандартный 4:3 или широкий 16:9. При оригинальных пропорциях рамка не задаётся. Меняется только вывод на странице; исходные файлы сохраняются."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XS="Колонки: xs — до 576 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_SM="Колонки: sm — от 576 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_MD="Колонки: md — от 768 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_LG="Колонки: lg — от 992 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XL="Колонки: xl — от 1200 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XXL="Колонки: xxl — от 1400 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XS_DESC="От 1 до 6. В галерее — число колонок, в слайдере — число видимых изображений. Действует до следующего брейкпоинта Bootstrap."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_SM_DESC="От 1 до 6. В галерее — число колонок, в слайдере — число видимых изображений. Действует до следующего брейкпоинта Bootstrap."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_MD_DESC="От 1 до 6. В галерее — число колонок, в слайдере — число видимых изображений. Действует до следующего брейкпоинта Bootstrap."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_LG_DESC="От 1 до 6. В галерее — число колонок, в слайдере — число видимых изображений. Действует до следующего брейкпоинта Bootstrap."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XL_DESC="От 1 до 6. В галерее — число колонок, в слайдере — число видимых изображений. Действует до следующего брейкпоинта Bootstrap."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XXL_DESC="От 1 до 6. В галерее — число колонок, в слайдере — число видимых изображений."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LIGHTBOX="Увеличение в Fancybox"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LIGHTBOX_DESC="Открывать изображения в отдельной группе этой галереи. Требуется включённый плагин Dharma Shop Fancybox или WT Fancybox. Настройка не зависит от основной галереи товара."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_CAPTION="Показывать подпись изображения"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_CAPTION_DESC="Подпись вводится отдельно у каждого изображения; она также используется как альтернативный текст."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FOLDER="Папка внутри хранилища галерей"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FOLDER_DESC="Только латинские буквы, цифры, дефис и подчёркивание. Путь: общая папка изображений / field-galleries / ID поля / эта папка / год. Разные поля хранят изображения раздельно."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_SETTINGS_INVALID="Проверьте настройки галереи: максимум от 1 до 100 изображений, галерея или слайдер, от 1 до 6 колонок для каждого размера экрана."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COUNT_INVALID="Для этого поля превышен установленный предел изображений. Удалите лишние изображения или увеличьте предел."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_NO_FILTER="Изображения галереи выводятся на витрине и не участвуют в фильтре товаров."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_COLUMNS_XS_DESC="От 1 до 6 колонок. Значение действует до следующего брейкпоинта Bootstrap."
