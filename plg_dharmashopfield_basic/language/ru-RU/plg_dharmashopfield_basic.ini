PLG_DHARMASHOPFIELD_BASIC_VIDEO_COLUMNS_XL_DESC="От 1 до 6 колонок. Значение действует до следующего брейкпоинта Bootstrap."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_COLUMNS_XXL_DESC="От 1 до 6 колонок для самого широкого экрана."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_NO_CARD="Видео показываются на странице товара. В списке товары и их обложки не загружаются."
