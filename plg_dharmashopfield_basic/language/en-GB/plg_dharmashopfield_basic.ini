PLG_DHARMASHOPFIELD_BASIC_FILES_NO_FILTER="Files are displayed as links and are not used as product filters."
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING="Uploaded file name"
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING_DESC="Keep the original name by default, including Cyrillic characters and spaces, or replace spaces and special characters with hyphens. Both modes remove invalid characters and respect filesystem length limits. A unique folder prevents overwriting. Applies to new uploads; files selected from the server are not renamed."
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING_ORIGINAL="Keep original name"
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING_CLEAN="Clean name for links"
PLG_DHARMASHOPFIELD_BASIC_FILES_NAME_INVALID="The file name could not be read. Use a UTF-8 file name."

PLG_DHARMASHOPFIELD_BASIC_FILES_LAYOUT="File arrangement"
PLG_DHARMASHOPFIELD_BASIC_FILES_LAYOUT_DESC="List shows one file per row. Grid shows cards in multiple columns, with one column on phones."
