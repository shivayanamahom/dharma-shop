PLG_DHARMASHOPFIELD_BASIC_VIDEO_FETCH_COVER="Automatically fetch service video covers"
PLG_DHARMASHOPFIELD_BASIC_VIDEO_FETCH_COVER_DESC="The server fetches the service thumbnail and stores it in the shared image directory. For YouTube, the standard cover is fetched without an API key; a key enables the title and available higher-resolution cover. If a service is unavailable, the link can be saved without a cover."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_FOLDER="Video subfolder"
