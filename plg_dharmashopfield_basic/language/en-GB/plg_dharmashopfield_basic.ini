PLG_DHARMASHOPFIELD_BASIC_FILES_SHOW_EXTENSION="Show file format"
PLG_DHARMASHOPFIELD_BASIC_FILES_NEW_TAB="Open in a new tab"
PLG_DHARMASHOPFIELD_BASIC_FILES_DROP="Drop files here"
PLG_DHARMASHOPFIELD_BASIC_FILES_LIMITS="Allowed: %s; up to %s MB per file; no more than %s files."
PLG_DHARMASHOPFIELD_BASIC_FILES_SETTINGS_INVALID="Check file settings: allowed formats, size between 0.1 and 1024 MB, count between 1 and 100."
