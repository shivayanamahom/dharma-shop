PLG_DHARMASHOPFIELD_BASIC_FILES_COUNT_INVALID="This field’s maximum file count has been reached. Remove files or increase the field limit."
PLG_DHARMASHOPFIELD_BASIC_FILES_NO_FILTER="Files are displayed as links and are not used as product filters."
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING="Uploaded file name"
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING_DESC="Keep the original name by default, including Cyrillic characters and spaces, or replace spaces and special characters with hyphens. Both modes remove invalid characters and respect filesystem length limits. A unique folder prevents overwriting. Applies to new uploads; files selected from the server are not renamed."
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING_ORIGINAL="Keep original name"
PLG_DHARMASHOPFIELD_BASIC_FILES_NAMING_CLEAN="Clean name for links"
PLG_DHARMASHOPFIELD_BASIC_FILES_NAME_INVALID="The file name could not be read. Use a UTF-8 file name."

PLG_DHARMASHOPFIELD_BASIC_FILES_LAYOUT="File arrangement"
PLG_DHARMASHOPFIELD_BASIC_FILES_LAYOUT_DESC="List shows one file per row. Grid shows cards in multiple columns, with one column on phones."
PLG_DHARMASHOPFIELD_BASIC_FILES_LAYOUT_LIST="Vertical list"
PLG_DHARMASHOPFIELD_BASIC_FILES_LAYOUT_GRID="Columns"
PLG_DHARMASHOPFIELD_BASIC_FILES_COLUMNS="Number of columns"
PLG_DHARMASHOPFIELD_BASIC_FILES_COLUMNS_DESC="2 to 6 columns on wide screens, up to two on medium screens, and one on phones."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_MAX_COUNT="Maximum number of images"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_MAX_COUNT_DESC="Between 1 and 100. This limit applies to each value of this field."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT="Display layout"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT_DESC="Gallery displays a grid; slider uses Swiper. Falls back to a gallery when Dharma Shop Swiper is disabled. Both layouts can be overridden in the Joomla template."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT_GRID="Gallery"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LAYOUT_SLIDER="Slider (Swiper)"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT="Image display"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_DESC="Fill creates an even grid without gaps, cropping edges without distortion. Fit shows the whole image inside equal frames. Original proportions remove the fixed height and do not enlarge small images. Applies to both gallery and slider."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_COVER="Fill frame — crop edges"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_CONTAIN="Fit whole image — leave gaps"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FIT_ORIGINAL="Original proportions — no enlargement"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_RATIO="Frame aspect ratio"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_RATIO_DESC="Equal aspect ratio for all images: square 1:1, standard 4:3, or wide 16:9. Not used with original proportions. Only changes page display; original files are preserved."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XS="Columns: xs — below 576 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_SM="Columns: sm — from 576 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_MD="Columns: md — from 768 px"
