PLG_DHARMASHOPFIELD_BASIC_GALLERY_CAPTION_DESC="Enter a caption for each image. It is also used as its alternative text."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FOLDER="Folder inside gallery storage"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FOLDER_DESC="Use Latin letters, numbers, hyphens, and underscores. Path: shared image folder / field-galleries / field ID / this folder / year. Each field stores images separately."
