PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XL_DESC="1 to 6 grid columns or visible slider images. Applies until the next Bootstrap breakpoint."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XXL_DESC="1 to 6 grid columns or visible slider images."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LIGHTBOX="Enlarge with Fancybox"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_LIGHTBOX_DESC="Open images in a separate group for this gallery. Requires Dharma Shop Fancybox or WT Fancybox. Independent of the main product gallery setting."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_CAPTION="Show image captions"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_CAPTION_DESC="Enter a caption for each image. It is also used as its alternative text."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FOLDER="Folder inside gallery storage"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_FOLDER_DESC="Use Latin letters, numbers, hyphens, and underscores. Path: shared image folder / field-galleries / field ID / this folder / year. Each field stores images separately."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_SETTINGS_INVALID="Check gallery settings: 1 to 100 images, gallery or slider, and 1 to 6 columns at each breakpoint."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COUNT_INVALID="This field’s image limit has been reached. Remove images or increase the limit."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_NO_FILTER="Gallery images are displayed on the storefront and are not available as product filters."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_EXTENSIONS="Video formats"
PLG_DHARMASHOPFIELD_BASIC_VIDEO_EXTENSIONS_DESC="Comma-separated extensions: mp4, webm, ogv. Upload size is determined by PHP and web server limits; this field does not set a separate limit. The server also verifies the file MIME type."
PLG_DHARMASHOPFIELD_BASIC_VIDEO_MAX_COUNT="Maximum videos"
PLG_DHARMASHOPFIELD_BASIC_VIDEO_MAX_COUNT_DESC="Total uploaded videos and service links: 1 to 100."
