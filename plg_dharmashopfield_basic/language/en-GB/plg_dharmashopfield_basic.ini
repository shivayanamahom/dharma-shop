PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XXL="Columns: xxl — from 1400 px"
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_XS_DESC="1 to 6 grid columns or visible slider images. Applies until the next Bootstrap breakpoint."
PLG_DHARMASHOPFIELD_BASIC_GALLERY_COLUMNS_SM_DESC="1 to 6 grid columns or visible slider images. Applies until the next Bootstrap breakpoint."
