PLG_DHARMASHOPFIELD_BASIC_FILES_MAX_MB="Maximum size per file, MB"
PLG_DHARMASHOPFIELD_BASIC_FILES_MAX_MB_DESC="Default: 10 MB. Uploads also respect the lower PHP and Joomla Media limits. The effective limit is shown in the uploader."
PLG_DHARMASHOPFIELD_BASIC_FILES_EXTENSIONS="Allowed formats"
PLG_DHARMASHOPFIELD_BASIC_FILES_EXTENSIONS_DESC="Comma-separated extensions without dots. Supported: pdf, txt, csv, rtf, doc, docx, xls, xlsx, ppt, pptx, odt, ods, odp, zip, 7z, rar, jpg, jpeg, png, webp. File contents are also checked."
PLG_DHARMASHOPFIELD_BASIC_FILES_MAX_COUNT="Maximum number of files"
PLG_DHARMASHOPFIELD_BASIC_FILES_MAX_COUNT_DESC="Between 1 and 100. Set 1 for a single file. Use arrows or drag to reorder."
PLG_DHARMASHOPFIELD_BASIC_FILES_LABEL="File link text"
PLG_DHARMASHOPFIELD_BASIC_FILES_LABEL_DESC="Each file has an optional caption. An empty caption falls back to the filename. This affects the storefront; the editor always shows the filename."
