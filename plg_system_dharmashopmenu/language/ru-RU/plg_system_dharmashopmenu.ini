PLG_SYSTEM_DHARMASHOPMENU="Система — Dharma Shop: раздел в меню админки"
PLG_SYSTEM_DHARMASHOPMENU_DESCRIPTION="Выводит отдельный раздел «Dharma Shop» в боковом меню админки сразу после «Компонентов» (заказы, корзины, покупатели, товары, категории, бренды, бейджи, поля, группы полей, статусы заказов, настройки и помощь) и убирает дубль из «Компонентов». Настроек нет; при отключении плагина меню возвращается в «Компоненты»."
