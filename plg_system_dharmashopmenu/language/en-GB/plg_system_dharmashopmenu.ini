PLG_SYSTEM_DHARMASHOPMENU="System - Dharma Shop: administrator menu section"
PLG_SYSTEM_DHARMASHOPMENU_DESCRIPTION="Adds a separate Dharma Shop section to the administrator sidebar right after Components (orders, carts, customers, products, categories, brands, badges, fields, field groups, order statuses, settings and help) and removes the duplicate from Components. No settings; when the plugin is disabled the menu returns under Components."
