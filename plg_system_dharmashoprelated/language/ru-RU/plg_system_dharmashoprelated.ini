PLG_SYSTEM_DHARMASHOPRELATED="Dharma Shop — связанные товары"
PLG_SYSTEM_DHARMASHOPRELATED_DESCRIPTION="Связанные товары в карточке товара: ручной выбор, подбор по категориям или совпадающим значениям полей. Настройка: Компоненты → Dharma Shop → Настройки → Связанные товары."
PLG_SYSTEM_DHARMASHOPRELATED_TAB="Связанные товары"
PLG_SYSTEM_DHARMASHOPRELATED_GENERAL="Общие настройки"
PLG_SYSTEM_DHARMASHOPRELATED_BLOCKS="Блоки связанных товаров"
PLG_SYSTEM_DHARMASHOPRELATED_BLOCKS_DESC="Добавьте один или несколько блоков. У каждого свои товары, место показа и макет. После первого сохранения ручные блоки появятся в редакторе товара."
PLG_SYSTEM_DHARMASHOPRELATED_POSITION="Место показа"
PLG_SYSTEM_DHARMASHOPRELATED_POSITION_NONE="Не показывать"
PLG_SYSTEM_DHARMASHOPRELATED_MODE="Режим подбора"
