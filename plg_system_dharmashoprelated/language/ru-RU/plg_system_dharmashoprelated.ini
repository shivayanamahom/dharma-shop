PLG_SYSTEM_DHARMASHOPRELATED_COLUMNS="Колонок на широком экране"
PLG_SYSTEM_DHARMASHOPRELATED_COLUMNS_DESC="От 1 до 6. На телефоне — одна колонка, от 576 px — до двух, от 992 px — указанное число."
PLG_SYSTEM_DHARMASHOPRELATED_COMPONENT_LAYOUTS="Использовать макеты компонента"
PLG_SYSTEM_DHARMASHOPRELATED_COMPONENT_LAYOUTS_DESC="Да — стандартные карточки Dharma Shop и их переопределения. Нет — отдельные карточки этого плагина, которые также можно переопределить в шаблоне Joomla."
PLG_SYSTEM_DHARMASHOPRELATED_ALIAS="Идентификатор блока"
PLG_SYSTEM_DHARMASHOPRELATED_ALIAS_DESC="Создаётся автоматически при первом сохранении. Связывает блок с выбранными в товаре рекомендациями и сохраняется при изменении названия и порядка."
PLG_SYSTEM_DHARMASHOPRELATED_MANUAL_DESC="Добавляйте товары кнопкой «+» и выбирайте их в стандартном окне поиска. Уже выбранные в этом блоке товары и сам редактируемый товар скрыты в окне выбора. После удаления или очистки строки товар снова доступен. Порядок строк задаёт порядок показа."
PLG_SYSTEM_DHARMASHOPRELATED_CONFIG_INVALID="У каждого блока связанных товаров должно быть название. Для подбора по полям выберите хотя бы одно поле."
