PLG_SYSTEM_DHARMASHOPRELATED_FIELDS="Автоматически по полям"
PLG_SYSTEM_DHARMASHOPRELATED_CATEGORIES_DESC="По умолчанию выбрана текущая основная категория товара. Можно выбрать другие категории или добавить их к текущей; учитываются также подкатегории. Пустой выбор означает текущую категорию. Сам товар исключается."
PLG_SYSTEM_DHARMASHOPRELATED_CURRENT_CATEGORY="Текущая категория товара"
PLG_SYSTEM_DHARMASHOPRELATED_MATCH_FIELDS="Поля для сравнения"
PLG_SYSTEM_DHARMASHOPRELATED_FIELDS_DESC="Выберите поля для сравнения с текущим товаром. У поля с несколькими значениями достаточно одного общего значения. Доступны списки, чекбоксы, строки, числа и диапазоны; редакторы и медиа не сравниваются."
PLG_SYSTEM_DHARMASHOPRELATED_FIELDS_OPERATOR="Условие совпадения полей"
PLG_SYSTEM_DHARMASHOPRELATED_FIELDS_OPERATOR_DESC="И — товар совпадает по всем выбранным полям. ИЛИ — достаточно совпадения хотя бы по одному полю. При одном поле результат одинаковый. По умолчанию — И."
PLG_SYSTEM_DHARMASHOPRELATED_FIELDS_AND="Все выбранные поля (И)"
PLG_SYSTEM_DHARMASHOPRELATED_FIELDS_OR="Любое выбранное поле (ИЛИ)"
PLG_SYSTEM_DHARMASHOPRELATED_FIELDS_REQUIRED="В блоке «%s» выберите хотя бы одно поле для автоматического подбора товаров."
PLG_SYSTEM_DHARMASHOPRELATED_LIMIT="Количество товаров"
