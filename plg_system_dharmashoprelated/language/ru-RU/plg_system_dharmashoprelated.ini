PLG_SYSTEM_DHARMASHOPRELATED_INCOMING="Автоматические встречные связи"
PLG_SYSTEM_DHARMASHOPRELATED_INCOMING_DESC="Эти товары выбрали текущий товар в этом блоке и автоматически появятся на его странице. Чтобы убрать такую связь, удалите исходное назначение в соответствующем товаре."
