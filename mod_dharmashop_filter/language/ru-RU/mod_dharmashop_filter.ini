MOD_DHARMASHOP_FILTER_CASCADE="Каскадная доступность значений"
MOD_DHARMASHOP_FILTER_CASCADE_DESC="Обновлять остальные фильтры после выбора условия. Действие с нулевыми значениями задаётся ниже. Числа при включённом каскаде учитывают текущий выбор; их можно скрыть. В режиме кнопки «Применить» обновляется только фильтр, без загрузки товаров."
MOD_DHARMASHOP_FILTER_SELECTED_VALUES="Выбрано значений"
MOD_DHARMASHOP_FILTER_PRICE_PRESETS_HINT="До 50 000 = 0-50000"
MOD_DHARMASHOP_FILTER_PRICE_PRESETS_HELP="Как заполнить интервалы цены"
MOD_DHARMASHOP_FILTER_PRICE_PRESETS_EXAMPLES="Каждый интервал — с новой строки. Слева от = подпись кнопки, справа — границы через дефис. Числа пишите без пробелов и знака валюты.<br><code>До 50 000 = 0-50000</code><br><code>50 000–100 000 = 50000-100000</code><br><code>От 100 000 = 100000-</code><br>Пустая граница означает отсутствие ограничения. На сайте появятся ссылки под полями цены; остальные условия фильтра сохраняются."
MOD_DHARMASHOP_FILTER_MODULE_STYLES="Оформление фильтра"
MOD_DHARMASHOP_FILTER_MODULE_STYLES_DESC="Подключает собственные стили модуля: карточка со скруглением и тенью, иконки системных разделов, пилюли выбранных значений, переключатели, плитки цвета. Цвета берутся из цвета Bootstrap и переменных --dharma-filter-*; выключите, если фильтр оформляется шаблоном сайта."
MOD_DHARMASHOP_FILTER_HEADING="Заголовок внутри карточки"
MOD_DHARMASHOP_FILTER_HEADING_DESC="Необязательный заголовок в верхней части карточки фильтра (например, «Фильтр товаров»). Пусто — не выводится; заголовок модуля Joomla настраивается отдельно."
MOD_DHARMASHOP_FILTER_OFFCANVAS_INLINE="Кнопку «Фильтр» ставить в строку сортировки"
MOD_DHARMASHOP_FILTER_OFFCANVAS_INLINE_DESC="На телефоне кнопка открытия фильтра переезжает в одну строку с сортировкой и переключателем вида списка (значок и число выбранных значений). Работает, когда на странице есть такая строка и включено «Оформление фильтра». Выключите, чтобы кнопка осталась отдельной строкой над списком."
