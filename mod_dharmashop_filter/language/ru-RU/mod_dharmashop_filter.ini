MOD_DHARMASHOP_FILTER_FIELDS_NOTE_DESC="Пока список пуст, фильтр строится сам: подкатегории, бренд, бейджи, цена, все поля с включённым флагом «Фильтр» (карточка поля → «Отображение») и наличие — для текущей категории. Добавляйте строки только чтобы задать порядок, скрыть пункт, переименовать или изменить представление."
MOD_DHARMASHOP_FILTER_FIELDS_CONFIG="Фильтры и их порядок"
MOD_DHARMASHOP_FILTER_FIELDS_CONFIG_DESC="Поля с включённым фильтром и системные фильтры (цена, бренд, бейджи, подкатегории, наличие). Порядок — перетаскиванием. Если список пуст, выводятся все: подкатегории, бренд, бейджи, цена, поля, наличие."
