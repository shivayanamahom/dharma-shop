MOD_DHARMASHOP_FILTER_PRICE_OPEN_DESC="В горизонтальном фильтре с выпадающими группами ползунки и поля «от/до» (цена и числовые диапазоны полей товаров) показываются сразу, без раскрытия. «Только в наличии» и «По акции» всегда стоят справа в нижней строке."
MOD_DHARMASHOP_FILTER_BAR_COLLAPSE="Кнопка «Свернуть» в углу"
MOD_DHARMASHOP_FILTER_BAR_COLLAPSE_DESC="В углу горизонтального фильтра показывается кнопка, которая сворачивает все группы и оставляет выбранные значения и число найденных товаров. Состояние запоминается в браузере посетителя. Без JavaScript кнопки нет, фильтр всегда развёрнут."
