PLG_DHARMASHOPSHIPPING_STANDARD="Dharma Shop: доставка — стандартная"
PLG_DHARMASHOPSHIPPING_STANDARD_DESC="Стандартная доставка: покупатель вводит данные (город, адрес, индекс, комментарий — конструктор полей), а менеджер потом уточняет детали заказа; подпись об этом настраивается. Можно задать цену, «бесплатно от суммы» и ограничения по сумме. Курьерская доставка с собственным расчётом — отдельный тип. Макет можно переопределить в шаблоне: html/plg_dharmashopshipping_standard/default.php."
