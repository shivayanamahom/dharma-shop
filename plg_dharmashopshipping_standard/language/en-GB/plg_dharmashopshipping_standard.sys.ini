PLG_DHARMASHOPSHIPPING_STANDARD="Dharma Shop: shipping - standard"
PLG_DHARMASHOPSHIPPING_STANDARD_DESC="Standard shipping: the customer enters details (city, address, postcode, comment - field builder) and a manager confirms the order details later; the note about it is configurable. You can set a price, free-from amount and order amount limits. Courier delivery with its own calculation is a separate type. The layout can be overridden in the template: html/plg_dharmashopshipping_standard/default.php."
