PLG_DHARMASHOPSHIPPING_STANDARD="Dharma Shop: shipping - standard"
PLG_DHARMASHOPSHIPPING_STANDARD_DESC="Delivery: the customer enters details (city, address, postcode, comment - field builder) and a manager confirms the order details later; the note about it is configurable. You can set a price, free-from amount and order amount limits. Door-to-door courier delivery is a separate Courier type. The layout can be overridden in the template: html/plg_dharmashopshipping_standard/default.php."
