PLG_DHARMASHOPPAYMENT_SANDBOX="Dharma Shop: оплата — тестовая (песочница)"
PLG_DHARMASHOPPAYMENT_SANDBOX_DESC="Тестовая оплата («песочница»): имитация платёжного шлюза для проверки всего процесса — заказ, страница оплаты, успех, отказ, отмена и обратный вызов. Деньги не списываются. Образец для плагинов настоящих шлюзов. Макеты можно переопределить в шаблоне: html/plg_dharmashoppayment_sandbox/."
