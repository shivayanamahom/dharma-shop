PLG_DHARMASHOPSHIPPING_COURIER="Dharma Shop: shipping - courier"
PLG_DHARMASHOPSHIPPING_COURIER_DESC="Door-to-door courier delivery: fixed price or by distance (base price + price per kilometer from the nearest warehouse to the customer address), free over an amount, order amount limits, delivery time, note and a customer field builder. The address is resolved by the Yandex geocoder (API key required), with address suggestions and a map of warehouses. The layout can be overridden in the template: html/plg_dharmashopshipping_courier/default.php."
