PLG_DHARMASHOPSHIPPING_COURIER_MAX_TOTAL_DESC="The method is hidden from customers when the order amount is higher. 0 means no limit."
PLG_DHARMASHOPSHIPPING_COURIER_WAREHOUSES="Dispatch warehouses"
PLG_DHARMASHOPSHIPPING_COURIER_WAREHOUSES_DESC="Where the courier starts (Ctrl/Cmd for several). The distance is counted from the warehouse nearest to the customer address; warehouses with coordinates are needed. Addresses and coordinates are kept in the Warehouses directory."
PLG_DHARMASHOPSHIPPING_COURIER_MAP_SETTINGS="Courier: key, suggestions and map"
PLG_DHARMASHOPSHIPPING_COURIER_YANDEX_APIKEY="Yandex Maps API key"
PLG_DHARMASHOPSHIPPING_COURIER_YANDEX_APIKEY_DESC="Key for JavaScript API and HTTP Geocoder from the Yandex developer console (developer.tech.yandex.ru). It is needed for the map, address suggestions (in the browser via ymaps3.suggest - the Geosuggest API service must be enabled for the key) and server-side address lookup with distance pricing. The key can be restricted to the site address (HTTP Referer): server requests are sent with a Referer header of this site address."
PLG_DHARMASHOPSHIPPING_COURIER_SUGGEST="Address suggestions"
PLG_DHARMASHOPSHIPPING_COURIER_SUGGEST_DESC="A drop-down list of addresses while typing in the Address field. The same Yandex geocoder requests are used; the number of requests is limited per session."
