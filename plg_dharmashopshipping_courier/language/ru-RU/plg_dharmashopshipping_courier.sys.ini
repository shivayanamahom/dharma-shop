PLG_DHARMASHOPSHIPPING_COURIER="Dharma Shop: доставка — курьер"
PLG_DHARMASHOPSHIPPING_COURIER_DESC="Курьерская доставка до двери: цена фиксированная или по расстоянию (базовая цена + цена за километр от ближайшего склада до адреса покупателя), «бесплатно от суммы», пределы суммы заказа, срок, подпись и конструктор полей покупателя. Адрес определяет геокодер Яндекса (нужен ключ API), есть подсказки адреса и карта со складами. Макет можно переопределить в шаблоне: html/plg_dharmashopshipping_courier/default.php."
