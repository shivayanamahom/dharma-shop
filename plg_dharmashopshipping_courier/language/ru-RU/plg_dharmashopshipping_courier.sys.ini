PLG_DHARMASHOPSHIPPING_COURIER_DESC="Курьерская доставка до двери: цена, «бесплатно от суммы», ограничения по сумме заказа, срок и конструктор полей (город, улица, квартира, подъезд, этаж, домофон, удобное время, комментарий курьеру). Расчёт по зонам и весу будет добавлен позже. Макет можно переопределить в шаблоне: html/plg_dharmashopshipping_courier/default.php."
