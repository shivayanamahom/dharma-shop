PLG_DHARMASHOPSHIPPING_COURIER="Dharma Shop: доставка — курьер"
PLG_DHARMASHOPSHIPPING_COURIER_DESC="Курьерская доставка до двери: цена фиксированная или по расстоянию (базовая цена + цена за километр от ближайшего склада до адреса покупателя), «бесплатно от суммы», пределы суммы заказа, срок, подпись и конструктор полей покупателя. Адрес определяет геокодер Яндекса (нужен ключ API), есть подсказки адреса и карта со складами. Макет можно переопределить в шаблоне: html/plg_dharmashopshipping_courier/default.php."
PLG_DHARMASHOPSHIPPING_COURIER_TYPE="Курьер"
PLG_DHARMASHOPSHIPPING_COURIER_SETTINGS="Курьер: основные настройки"
PLG_DHARMASHOPSHIPPING_COURIER_TERM="Срок доставки"
PLG_DHARMASHOPSHIPPING_COURIER_TERM_DESC="Текст рядом с названием, например «1–2 дня»."
PLG_DHARMASHOPSHIPPING_COURIER_NOTE="Подпись для покупателя"
PLG_DHARMASHOPSHIPPING_COURIER_NOTE_DESC="Короткое пояснение под способом на странице оформления, в боковой панели, заказе и письмах. Например: «Курьер позвонит вам перед доставкой»."
PLG_DHARMASHOPSHIPPING_COURIER_FIELDS="Дополнительные поля покупателя"
PLG_DHARMASHOPSHIPPING_COURIER_FIELDS_DESC="Что ещё спрашивать при выборе курьера (квартира, подъезд, этаж, комментарий и т. п.). Значения попадают в заказ, письма и боковую панель оформления."
