PLG_DHARMASHOPSHIPPING_COURIER_MARKER_ADDRESS_COLOR_DESC="Метка и линия до адреса покупателя."
PLG_DHARMASHOPSHIPPING_COURIER_ZOOM="Масштаб карты"
PLG_DHARMASHOPSHIPPING_COURIER_ZOOM_DESC="0 — карта вмещает все склады (после расчёта — склад и адрес); значение 1–19 задаёт масштаб явно."
PLG_DHARMASHOPSHIPPING_COURIER_RATIO="Высота карты (пропорции)"
PLG_DHARMASHOPSHIPPING_COURIER_RATIO_DESC="Форма блока карты: высота считается от ширины (классы Bootstrap)."
