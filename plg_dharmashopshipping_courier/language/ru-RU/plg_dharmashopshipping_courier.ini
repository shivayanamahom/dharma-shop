PLG_DHARMASHOPSHIPPING_COURIER_BASE_NOTE="Адрес доставки: город, улица, дом"
PLG_DHARMASHOPSHIPPING_COURIER_BASE_NOTE_DESC="Город, улица и дом обязательны и всегда есть, убрать их нельзя: по ним определяется точка доставки. Покупатель вводит их одной строкой «Адрес доставки» с подсказками (или ставит точку на карте); если подсказки выключены и цена не по расстоянию, выводятся тремя отдельными полями. Ниже добавляются остальные поля."
PLG_DHARMASHOPSHIPPING_COURIER_BASE_CITY="Город"
PLG_DHARMASHOPSHIPPING_COURIER_BASE_STREET="Улица"
PLG_DHARMASHOPSHIPPING_COURIER_BASE_HOUSE="Дом"
PLG_DHARMASHOPSHIPPING_COURIER_WAREHOUSES_LEGEND="Курьер: склады отправки"
PLG_DHARMASHOPSHIPPING_COURIER_VERIFY="Проверять существование адреса"
PLG_DHARMASHOPSHIPPING_COURIER_VERIFY_DESC="При оформлении адрес проверяется по геокодеру Яндекса: дом должен существовать в указанном городе. При расчёте цены по расстоянию проверка выполняется всегда. Если сервис недоступен, заказ при фиксированной цене всё равно оформляется."
PLG_DHARMASHOPSHIPPING_COURIER_ERROR_HOUSE="Такого дома не нашли. Выберите дом из подсказки или проверьте номер."
PLG_DHARMASHOPSHIPPING_COURIER_SEARCH_LABEL="Адрес доставки"
PLG_DHARMASHOPSHIPPING_COURIER_SEARCH_PLACEHOLDER="Начните вводить город, улицу и дом"
PLG_DHARMASHOPSHIPPING_COURIER_MAP_HINT="Или нажмите на карте — адрес определится сам."
PLG_DHARMASHOPSHIPPING_COURIER_DISTANCE_METHOD="Как считать расстояние"
PLG_DHARMASHOPSHIPPING_COURIER_DISTANCE_METHOD_DESC="По прямой — от ближайшего по прямой склада, расстояние умножается на дорожный коэффициент (работает с любым ключом). По дорогам — длина маршрута на автомобиле от складов до адреса (ближайший по дороге склад), Матрица расстояний Яндекса: нужен ключ с подключённым сервисом; если сервис недоступен, считается по прямой."
PLG_DHARMASHOPSHIPPING_COURIER_DISTANCE_METHOD_STRAIGHT="По прямой с дорожным коэффициентом"
PLG_DHARMASHOPSHIPPING_COURIER_DISTANCE_METHOD_ROAD="По дорогам (Яндекс)"
PLG_DHARMASHOPSHIPPING_COURIER_ROUTER_APIKEY="Ключ для расчёта по дорогам"
PLG_DHARMASHOPSHIPPING_COURIER_ROUTER_APIKEY_DESC="Ключ сервиса «Матрица расстояний/Маршрутизатор» из Кабинета разработчика Яндекса. Если пусто, используется основной ключ — тогда этот сервис должен быть подключён ему."
PLG_DHARMASHOPSHIPPING_COURIER_DISTANCE_ROAD="%s км по дорогам"
