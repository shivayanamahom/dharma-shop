PLG_DHARMASHOPSHIPPING_COURIER_ERROR_WAREHOUSES="Для цены по расстоянию выберите хотя бы один склад с координатами (справочник «Склады»)."
PLG_DHARMASHOPSHIPPING_COURIER_ERROR_KEY_NEEDED="Для цены по расстоянию нужен ключ API Яндекс Карт (вкладка «Настройка карты»)."
