PLG_DHARMASHOPSHIPPING_COURIER_FIELD_OPTIONS_DESC="По одному варианту в строке."
PLG_DHARMASHOPSHIPPING_COURIER_PRICE_SETTINGS="Цена и ограничения по сумме заказа"
PLG_DHARMASHOPSHIPPING_COURIER_PRICE_MODE="Как считать цену"
PLG_DHARMASHOPSHIPPING_COURIER_PRICE_MODE_DESC="Фиксированная цена одна для всего города. По расстоянию — базовая цена плюс цена за километр от ближайшего склада до адреса покупателя."
PLG_DHARMASHOPSHIPPING_COURIER_PRICE_MODE_FIXED="Фиксированная цена"
PLG_DHARMASHOPSHIPPING_COURIER_PRICE_MODE_DISTANCE="По расстоянию (км)"
PLG_DHARMASHOPSHIPPING_COURIER_PRICE="Стоимость доставки"
PLG_DHARMASHOPSHIPPING_COURIER_PRICE_DESC="Фиксированная цена в валюте магазина. 0 — доставка бесплатна."
PLG_DHARMASHOPSHIPPING_COURIER_KM_BASE="Базовая цена"
PLG_DHARMASHOPSHIPPING_COURIER_KM_BASE_DESC="Стоимость доставки в пределах «включённых километров» (или без них)."
PLG_DHARMASHOPSHIPPING_COURIER_KM_INCLUDED="Включено километров"
PLG_DHARMASHOPSHIPPING_COURIER_KM_INCLUDED_DESC="Первые километры входят в базовую цену. 0 — каждый километр оплачивается."
PLG_DHARMASHOPSHIPPING_COURIER_KM_PRICE="Цена за километр"
PLG_DHARMASHOPSHIPPING_COURIER_KM_PRICE_DESC="Добавляется за каждый километр сверх включённых."
PLG_DHARMASHOPSHIPPING_COURIER_KM_MAX_PRICE="Предельная цена"
PLG_DHARMASHOPSHIPPING_COURIER_KM_MAX_PRICE_DESC="Цена доставки не будет выше этой суммы. 0 — без предела."
PLG_DHARMASHOPSHIPPING_COURIER_KM_MAX_DISTANCE="Предельное расстояние, км"
PLG_DHARMASHOPSHIPPING_COURIER_KM_MAX_DISTANCE_DESC="Дальше этого расстояния курьер не доставляет: покупатель увидит сообщение. 0 — без предела."
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROAD_FACTOR="Дорожный коэффициент"
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROAD_FACTOR_DESC="Расстояние считается по прямой от ближайшего склада и умножается на этот коэффициент, чтобы приблизиться к дорожному (обычно 1,2–1,4)."
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND="Округление цены вверх"
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND_DESC="Цена округляется вверх до кратного этой сумме."
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND_NONE="Не округлять"
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND_1="До 1"
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND_5="До 5"
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND_10="До 10"
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND_50="До 50"
PLG_DHARMASHOPSHIPPING_COURIER_KM_ROUND_100="До 100"
PLG_DHARMASHOPSHIPPING_COURIER_FREE_FROM="Бесплатно от суммы заказа"
PLG_DHARMASHOPSHIPPING_COURIER_FREE_FROM_DESC="Если сумма заказа (после скидок, без доставки) не меньше этого значения, доставка бесплатна в любом режиме. 0 — не использовать."
PLG_DHARMASHOPSHIPPING_COURIER_MIN_TOTAL="Минимальная сумма заказа"
PLG_DHARMASHOPSHIPPING_COURIER_MIN_TOTAL_DESC="Если сумма заказа меньше, способ покупателю не показывается. 0 — без ограничения."
PLG_DHARMASHOPSHIPPING_COURIER_MAX_TOTAL="Максимальная сумма заказа"
PLG_DHARMASHOPSHIPPING_COURIER_MAX_TOTAL_DESC="Если сумма заказа больше, способ покупателю не показывается. 0 — без ограничения."
PLG_DHARMASHOPSHIPPING_COURIER_WAREHOUSES="Склады отправки"
PLG_DHARMASHOPSHIPPING_COURIER_WAREHOUSES_DESC="Откуда курьер развозит заказы (Ctrl/Cmd — несколько). Расстояние считается от ближайшего к адресу покупателя склада; нужны склады с координатами. Адреса и координаты хранятся в справочнике «Склады»."
PLG_DHARMASHOPSHIPPING_COURIER_MAP_SETTINGS="Курьер: ключ, подсказки и карта"
PLG_DHARMASHOPSHIPPING_COURIER_YANDEX_APIKEY="Ключ API Яндекс Карт"
PLG_DHARMASHOPSHIPPING_COURIER_YANDEX_APIKEY_DESC="Ключ для «JavaScript API и HTTP Геокодер» из Кабинета разработчика Яндекса (developer.tech.yandex.ru). Нужен для карты, подсказок адреса (в браузере через ymaps3.suggest — сервис «API Геосаджеста» должен быть подключён ключу) и определения адреса на сервере при цене по расстоянию. Ключ можно ограничить по адресу сайта (HTTP Referer): серверные запросы идут с заголовком Referer адреса этого сайта."
PLG_DHARMASHOPSHIPPING_COURIER_SUGGEST="Подсказки адреса"
PLG_DHARMASHOPSHIPPING_COURIER_SUGGEST_DESC="Выпадающий список адресов при вводе в поле «Адрес». Используются те же запросы к геокодеру Яндекса; число запросов ограничено на сессию."
PLG_DHARMASHOPSHIPPING_COURIER_MAP="Вид карты"
PLG_DHARMASHOPSHIPPING_COURIER_MAP_DESC="Карта со складами и точкой доставки под полями адреса (только при цене по расстоянию). Подключается сервис Яндекс Карт: при просмотре карты браузер покупателя обращается к нему."
PLG_DHARMASHOPSHIPPING_COURIER_MAP_NONE="Без карты"
PLG_DHARMASHOPSHIPPING_COURIER_MAP_YANDEX="Яндекс Карты"
PLG_DHARMASHOPSHIPPING_COURIER_MARKER_KIND="Тип метки"
PLG_DHARMASHOPSHIPPING_COURIER_MARKER_KIND_DESC="Вид меток складов на карте."
PLG_DHARMASHOPSHIPPING_COURIER_MARKER_ICON="Булавка"
PLG_DHARMASHOPSHIPPING_COURIER_MARKER_DOT="Булавка с точкой"
PLG_DHARMASHOPSHIPPING_COURIER_MARKER_CIRCLE="Круг с точкой"
PLG_DHARMASHOPSHIPPING_COURIER_MARKER_LABEL="Метка с названием склада"
