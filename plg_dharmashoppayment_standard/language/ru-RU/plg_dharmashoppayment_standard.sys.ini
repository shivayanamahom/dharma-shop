PLG_DHARMASHOPPAYMENT_STANDARD_DESC="Стандартная оплата: оплата вне сайта (наличными или картой курьеру, при самовывозе, по счёту). Страницы оплаты нет: покупатель видит инструкцию на оформлении, в заказе и в письме; можно задать пределы суммы заказа. Способов этого типа можно создать несколько («Наличными», «Картой курьеру»). Макет можно переопределить в шаблоне: html/plg_dharmashoppayment_standard/default.php."
