PLG_DHARMASHOPPAYMENT_STANDARD="Dharma Shop: payment - standard"
PLG_DHARMASHOPPAYMENT_STANDARD_DESC="Standard payment: payment outside the site (cash or card to the courier, at pickup, by invoice). There is no payment page: the customer sees the instruction at checkout, in the order and in the email; order amount limits can be set. You can create several methods of this type (Cash, Card to the courier). The layout can be overridden in the template: html/plg_dharmashoppayment_standard/default.php."
