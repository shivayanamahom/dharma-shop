PLG_DHARMASHOPPAYMENT_STANDARD="Dharma Shop: payment - standard"
PLG_DHARMASHOPPAYMENT_STANDARD_DESC="Standard payment: payment outside the site (cash or card to the courier, at pickup, by invoice). There is no payment page: the customer sees the instruction at checkout, in the order and in the email; order amount limits can be set. You can create several methods of this type (Cash, Card to the courier). The layout can be overridden in the template: html/plg_dharmashoppayment_standard/default.php."
PLG_DHARMASHOPPAYMENT_STANDARD_TYPE="Standard payment"
PLG_DHARMASHOPPAYMENT_STANDARD_SETTINGS="Standard payment: settings"
PLG_DHARMASHOPPAYMENT_STANDARD_INSTRUCTION="Instruction for the customer"
PLG_DHARMASHOPPAYMENT_STANDARD_INSTRUCTION_DESC="How to pay (for example, “Pay the courier on delivery”). Shown at checkout, in the order and in the email."
PLG_DHARMASHOPPAYMENT_STANDARD_MIN_TOTAL="Minimum order amount"
PLG_DHARMASHOPPAYMENT_STANDARD_MIN_TOTAL_DESC="If the order amount (with delivery) is less, the method is not shown. 0 means no limit."
PLG_DHARMASHOPPAYMENT_STANDARD_MAX_TOTAL="Maximum order amount"
PLG_DHARMASHOPPAYMENT_STANDARD_MAX_TOTAL_DESC="If the order amount (with delivery) is greater, the method is not shown. 0 means no limit."
PLG_DHARMASHOPPAYMENT_STANDARD_ERROR_MIN_TOTAL="The minimum order amount must be a non-negative number."
PLG_DHARMASHOPPAYMENT_STANDARD_ERROR_MAX_TOTAL="The maximum order amount must be a non-negative number."
