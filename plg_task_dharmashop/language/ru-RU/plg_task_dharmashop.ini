PLG_TASK_DHARMASHOP_SALES_TITLE="Dharma Shop: скидки по датам"
PLG_TASK_DHARMASHOP_SALES_DESC="Пересчитывает цену у товаров, у которых скидка началась или закончилась. Запускайте не реже раза в час: без задачи цена в корзине меняется только по кнопке «Пересчитать скидки по датам»."
PLG_TASK_DHARMASHOP_FACETS_TITLE="Dharma Shop: сверка счётчиков фильтра"
PLG_TASK_DHARMASHOP_FACETS_DESC="Сверяет предрасчёт фильтра и индекс выдачи групп с фактическим подсчётом и при расхождениях пересобирает их. Достаточно раза в сутки."
PLG_TASK_DHARMASHOP_LANDING_TITLE="Dharma Shop: проверка посадочных страниц"
PLG_TASK_DHARMASHOP_LANDING_DESC="Находит посадочные страницы, чьи условия больше не распознаются каталогом (удалён бренд, бейдж, поле или значение, закрыта категория, нет товаров в ручном списке), и помечает их: на сайте такая страница отдаёт 404 до исправления. Рекомендуется раз в сутки."
