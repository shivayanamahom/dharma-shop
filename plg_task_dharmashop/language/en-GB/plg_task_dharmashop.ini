PLG_TASK_DHARMASHOP_SALES_TITLE="Dharma Shop: scheduled discounts"
PLG_TASK_DHARMASHOP_SALES_DESC="Recalculates the price of products whose discount has started or ended. Run at least hourly: without this task the cart price changes only with the \"Recalculate discounts by date\" command."
PLG_TASK_DHARMASHOP_FACETS_TITLE="Dharma Shop: filter counters check"
PLG_TASK_DHARMASHOP_FACETS_DESC="Compares the precomputed filter data and the group listing index with a live count and rebuilds them if they differ. Once a day is enough."
PLG_TASK_DHARMASHOP_LANDING_TITLE="Dharma Shop: landing page check"
PLG_TASK_DHARMASHOP_LANDING_DESC="Finds landing pages whose conditions the catalog no longer recognises (a brand, badge, field or value was removed, the category is closed, the manual list has no products) and marks them: such a page returns 404 until fixed. Recommended once a day."
