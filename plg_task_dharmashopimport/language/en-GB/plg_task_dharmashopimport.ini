PLG_TASK_DHARMASHOPIMPORT_USER="Run as user"
PLG_TASK_DHARMASHOPIMPORT_USER_DESC="Permissions on catalog records are checked for this user. Empty: the first super user."
PLG_TASK_DHARMASHOPIMPORT_APPLY="Apply without confirmation"
PLG_TASK_DHARMASHOPIMPORT_APPLY_DESC="Off: the task only checks the file, the result must be applied by hand in Import. On: after a check without errors (or with errors if the profile allows skipping them) the changes are written to the catalog automatically."
