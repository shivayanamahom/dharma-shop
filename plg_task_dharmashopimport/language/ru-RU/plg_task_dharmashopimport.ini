PLG_TASK_DHARMASHOPIMPORT="Dharma Shop: импорт по расписанию"
PLG_TASK_DHARMASHOPIMPORT_DESCRIPTION="Задача планировщика Joomla: проверяет профиль импорта Dharma Shop и, если включено, применяет его; незавершённый запуск продолжается порциями при каждом срабатывании. Создаётся в списке профилей импорта кнопкой «В планировщик»."
PLG_TASK_DHARMASHOPIMPORT_RUN_TITLE="Dharma Shop: импорт по расписанию"
PLG_TASK_DHARMASHOPIMPORT_RUN_DESC="Запуск выбранного профиля импорта от имени выбранного пользователя; прерванный запуск продолжается."
PLG_TASK_DHARMASHOPIMPORT_PROFILE="Профиль импорта"
PLG_TASK_DHARMASHOPIMPORT_USER="Выполнять от имени пользователя"
PLG_TASK_DHARMASHOPIMPORT_USER_DESC="Права на записи каталога проверяются для этого пользователя. Пусто — первый суперпользователь."
PLG_TASK_DHARMASHOPIMPORT_APPLY="Применять без подтверждения"
PLG_TASK_DHARMASHOPIMPORT_APPLY_DESC="Выключено: задача только проверяет файл, применить результат нужно вручную в разделе «Импорт». Включено: после проверки без ошибок (или с ошибками, если профиль разрешает их пропускать) изменения записываются в каталог сами."
